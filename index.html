<!DOCTYPE html>
<html lang="en">
<head>

</header>

    <p>
        Facebook |
        Instagram |

</footer>

<script type="module" src="app.js"></script>

<script>
function scrollToProducts(){
    document.getElementById("products").scrollIntoView({
        behavior:"smooth"
    });
}
</script>
